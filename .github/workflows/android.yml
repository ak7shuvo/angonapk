name: Android build

# Builds a release APK and App Bundle. Needs no secrets: without signing secrets
# the artifacts are signed with the DEBUG key and are for testing only, never for
# the Play Store. Add the optional secrets below to produce upload-signed builds.
#
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
#
# Optional repository variable: API_BASE_URL (must be https for release builds).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Configure release signing (only when secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$RUNNER_TEMP/upload.jks"
            } > android/key.properties
            echo "Signing with the upload key."
          else
            echo "No signing secrets: artifacts will be signed with the debug key (testing only)."
          fi

      - name: Build APK
        run: flutter build apk --release --dart-define=APP_ENV=production --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Build App Bundle
        run: flutter build appbundle --release --dart-define=APP_ENV=production --dart-define=API_BASE_URL=$API_BASE_URL

      - uses: actions/upload-artifact@v4
        with:
          name: angon-android-release
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
