name: Android debug build (LAN testing)

# Builds a DEBUG APK that may talk to a plain-http API (e.g. http://192.168.0.105:8000).
# Debug builds allow cleartext traffic; release builds do not. For local testing only.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API origin, e.g. http://192.168.0.105:8000 (no trailing slash, no /api/v1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --debug --dart-define=APP_ENV=development --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: angon-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
