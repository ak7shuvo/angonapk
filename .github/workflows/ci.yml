name: CI

on:
  push:
  pull_request:

# Cancel superseded runs of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"
  PYTHON_VERSION: "3.11"
  PG_URL: postgresql+psycopg://angon:angon@localhost:5432/angon_test

jobs:
  mobile:
    name: Flutter format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # End-to-end tests are skipped here (no server); the `e2e` job runs them.
      - run: flutter test

  backend:
    name: Backend format, lint, tests (SQLite + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: angon
          POSTGRES_PASSWORD: angon
          POSTGRES_DB: angon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U angon" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - name: pytest (SQLite)
        run: pytest -q
      - name: pytest (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Migrations apply, roll back and re-apply on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: ${{ env.PG_URL }}
      - name: Models and migrations agree
        run: alembic check
        env:
          DATABASE_URL: ${{ env.PG_URL }}

  dependency-audit:
    name: Python dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # New advisories appear at any time; report them without blocking unrelated work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  e2e:
    name: Flutter client against the real API (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: angon
          POSTGRES_PASSWORD: angon
          POSTGRES_DB: angon_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U angon" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://angon:angon@localhost:5432/angon_e2e
      # The tests register many accounts from one IP; the limiter has its own tests.
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Migrate, seed and start the API
        working-directory: backend
        run: |
          alembic upgrade head
          python -m scripts.seed_dev
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: Run e2e tests
        working-directory: mobile
        run: flutter test test/e2e --dart-define=E2E_API_BASE_URL=http://127.0.0.1:8000
      - name: API log
        if: failure()
        run: cat /tmp/api.log
